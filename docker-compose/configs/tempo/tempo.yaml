# Tempo 단일 바이너리 설정 (PoC/사내 소규모)

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  # 수집기에서 들어오는 트레이스만 받으면 충분 — 외부 4317/4318은 OTel Collector 쪽
  # 다만 컨테이너간 통신용으로 내부 노출은 필요. 위의 호스트 매핑은 docker-compose에서 안 함.

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h     # 7일

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Grafana 측에서 metrics generator(서비스 그래프, 스팬 메트릭) 활성화하려면 아래 사용
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
